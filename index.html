<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeyMax — Pattern Generator</title>
<style>
:root{
  --bg:#F9F5FF; --panel:#FFFFFF; --panel-2:#F3EAFF;
  --text:#21005E; --text-secondary:#514C56; --text-muted:#888;
  --border:#E9E8EB; --border-strong:#D8C1FF; --radius:8px;
  --accent:#4000B8;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh}
.app{max-width:1120px;margin:0 auto;padding:32px 24px}
header{margin-bottom:24px}
header h1{font-size:20px;font-weight:600;letter-spacing:-.01em}
header p{font-size:13px;color:var(--text-secondary);margin-top:4px}
.wrap{display:flex;gap:24px;align-items:flex-start}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.canvas-shell{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:1px solid var(--border)}
.canvas-shell.alpha{background:repeating-conic-gradient(#E9E8EB 0% 25%,#fff 0% 50%) 0 0/20px 20px}
#patternSvg{width:100%;height:100%;display:block}
.stage-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--text-muted);letter-spacing:.04em}
.tag b{color:var(--text-secondary);font-weight:500}
.actions{display:flex;gap:8px}
button.btn{border:1px solid var(--border-strong);background:var(--panel);color:var(--text);border-radius:var(--radius);padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:background .15s}
button.btn:hover{background:var(--panel-2)}
button.btn:active{transform:scale(.98)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.btn.primary:hover{background:#21005E}
.controls{width:250px;flex-shrink:0;display:flex;flex-direction:column;gap:13px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;max-height:86vh;overflow-y:auto}
.ctrl label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:5px}
.row{display:flex;align-items:center;gap:9px}
.row input[type=range]{flex:1;accent-color:#4000B8}
.row .val{font-size:12px;font-weight:500;min-width:38px;text-align:right;color:var(--text)}
select,input[type=color]{width:100%;border:1px solid var(--border-strong);border-radius:var(--radius);padding:7px 9px;font-size:13px;background:#fff;color:var(--text)}
input[type=color]{padding:2px 4px;height:36px;cursor:pointer}
.seg{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;padding-top:10px;margin-top:2px;border-top:1px solid var(--border)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:2px}
.sw{height:26px;border-radius:6px;border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden}
.sw.sel{outline:2px solid #4000B8;outline-offset:1px}
.sw::after{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;background:var(--fg)}
.cond{display:none}
@media(max-width:760px){.wrap{flex-direction:column}.controls{width:100%;max-height:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>HeyMax pattern generator</h1>
    <p>Eight non-overlapping layouts built from the monogram, in brand colours.</p>
  </header>

  <div class="wrap">
    <div class="stage">
      <div class="canvas-shell">
        <svg id="patternSvg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <symbol id="mono" viewBox="0 0 246 378">
              <path d="M123 0C190.931 4.39387e-05 246 55.0699 246 123.001V254.2C246 322.131 190.931 377.201 123 377.201C55.0689 377.201 0 322.131 0 254.2V123.001C0 55.0699 55.0689 0 123 0ZM123 13.667C62.6168 13.667 13.667 62.6178 13.667 123.001V254.2C13.667 314.583 62.6168 363.534 123 363.534C183.383 363.534 232.333 314.583 232.333 254.2V123.001C232.333 62.6178 183.383 13.667 123 13.667ZM77.917 134.473L77.9756 136.655C79.1503 159.115 98.3309 177.346 122.307 177.346C146.281 177.344 165.458 159.114 166.633 136.655L166.691 134.473V106.6H192.674V267.381H166.691V187.687C154.55 197.313 139.082 203.072 122.307 203.072C105.531 203.072 90.0589 197.313 77.917 187.687V267.381H51.9336V106.6H77.917V134.473Z"/>
            </symbol>
            <symbol id="logoSym" viewBox="0 0 400 109"></symbol>
          </defs>
          <rect id="bgRect" width="600" height="600" fill="#21005E"/>
          <g id="bgFx"></g>
          <g id="elements"></g>
          <g id="logo"></g>
        </svg>
      </div>
      <div class="stage-foot">
        <span class="tag"><b id="actualCount">0</b> marks · <b id="patName">grid</b> · no overlap</span>
        <div class="actions">
          <button class="btn" id="moveGradBtn">Move gradient</button>
          <button class="btn" id="shuffleBtn">Shuffle seed</button>
          <button class="btn" id="exportPngBtn">Export PNG</button>
          <button class="btn primary" id="exportBtn">Export SVG</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl">
        <label>Format</label>
        <select id="ratio">
          <option value="1:1" selected>1:1 — square</option>
          <option value="16:9">16:9 — landscape</option>
          <option value="9:16">9:16 — portrait / story</option>
          <option value="5:4">5:4 — landscape</option>
          <option value="4:5">4:5 — portrait / feed</option>
        </select>
      </div>
      <div class="ctrl">
        <label>Pattern</label>
        <select id="patType">
          <option value="grid" selected>Grid</option>
          <option value="fibonacci">Fibonacci spiral</option>
          <option value="perlin">Perlin flow field</option>
          <option value="circles">Concentric circles</option>
          <option value="halftone">Halftone</option>
          <option value="waves">Waves</option>
          <option value="orbit">Orbit rings</option>
          <option value="cascade">Diagonal cascade</option>
        </select>
      </div>

      <div class="seg">Composition</div>
      <div class="ctrl">
        <label>Count <span style="color:var(--text-muted)">(target)</span></label>
        <div class="row"><input type="range" id="count" min="9" max="500" value="169" step="1"><span class="val" id="countOut">169</span></div>
      </div>
      <div class="ctrl">
        <label>Element size</label>
        <div class="row"><input type="range" id="elemSize" min="20" max="100" value="80" step="1"><span class="val" id="elemSizeOut">80%</span></div>
      </div>
      <div class="ctrl">
        <label>Spread</label>
        <div class="row"><input type="range" id="spread" min="40" max="100" value="92" step="1"><span class="val" id="spreadOut">92%</span></div>
      </div>
      <div class="ctrl">
        <label>Rotation</label>
        <div class="row"><input type="range" id="rotation" min="0" max="360" value="0" step="1"><span class="val" id="rotationOut">0&deg;</span></div>
      </div>
      <div class="ctrl cond" data-for="perlin halftone waves">
        <label id="modLabel">Turbulence / wave detail</label>
        <div class="row"><input type="range" id="noiseScale" min="1" max="20" value="6" step="1"><span class="val" id="noiseScaleOut">6</span></div>
      </div>
      <div class="ctrl cond" data-for="halftone waves cascade orbit">
        <label>Effect strength</label>
        <div class="row"><input type="range" id="strength" min="0" max="100" value="70" step="1"><span class="val" id="strengthOut">70%</span></div>
      </div>

      <div class="seg">Colour</div>
      <div class="ctrl">
        <label>Colour mode</label>
        <select id="colorMode">
          <option value="mono" selected>Single colour</option>
          <option value="ramp">Brand ramp</option>
        </select>
      </div>
      <div class="ctrl">
        <label>Brand pairings</label>
        <div class="swatches" style="grid-template-columns:repeat(3,1fr)">
          <div class="sw" data-bg="#F3EAFF" data-fg="#21005E" style="background:#F3EAFF;--fg:#21005E"></div>
          <div class="sw" data-bg="#F9F5FF" data-fg="#4000B8" style="background:#F9F5FF;--fg:#4000B8"></div>
          <div class="sw" data-bg="#FFFFFF" data-fg="#4000B8" style="background:#FFFFFF;--fg:#4000B8"></div>
        </div>
      </div>
      <div class="ctrl">
        <label>Background style</label>
        <select id="bgStyle">
          <option value="grad1" selected>Gradient — 1 tint</option>
          <option value="grad2">Gradient — 2 tints</option>
          <option value="solid">Solid</option>
          <option value="alpha">Transparent (alpha)</option>
        </select>
      </div>
      <div class="ctrl bgbase">
        <label>Background base</label>
        <div class="swatches" style="grid-template-columns:repeat(3,1fr)">
          <div class="sw" data-base="#F4F4F4" style="background:#F4F4F4;--fg:#F4F4F4" title="Neutral"></div>
          <div class="sw" data-base="#F9F5FF" style="background:#F9F5FF;--fg:#F9F5FF" title="Brand"></div>
          <div class="sw" data-base="#FEF7FD" style="background:#FEF7FD;--fg:#FEF7FD" title="Pink"></div>
        </div>
      </div>
      <input type="hidden" id="bgColor" value="#F9F5FF">
      <div class="ctrl">
        <label>Element fill</label>
        <div class="swatches" id="fillSwatches" style="grid-template-columns:repeat(7,1fr)">
          <div class="sw fill" data-fill="#21005E" style="background:#21005E;--fg:#21005E" title="Primary"></div>
          <div class="sw fill" data-fill="#F3EAFF" style="background:#F3EAFF;--fg:#F3EAFF" title="Secondary"></div>
          <div class="sw fill" data-fill="#4000B8" style="background:#4000B8;--fg:#4000B8" title="Tertiary"></div>
          <div class="sw fill" data-fill="#FFFFFF" style="background:#FFFFFF;--fg:#FFFFFF" title="White"></div>
          <div class="sw fill" data-fill="#FCFAFF" style="background:#FCFAFF;--fg:#FCFAFF" title="Neutral 005"></div>
          <div class="sw fill" data-fill="#313131" style="background:#313131;--fg:#313131" title="Neutral 090"></div>
          <div class="sw fill" data-fill="#1A1A1A" style="background:#1A1A1A;--fg:#1A1A1A" title="Neutral 100"></div>
        </div>
        <input type="hidden" id="elemColor" value="#21005E">
      </div>
      <div class="ctrl">
        <label>Shape opacity</label>
        <div class="row"><input type="range" id="opacity" min="10" max="100" value="100" step="1"><span class="val" id="opacityOut">100%</span></div>
      </div>

      <div class="seg">Logo</div>
      <div class="ctrl">
        <label class="row" style="cursor:pointer;color:var(--text)"><input type="checkbox" id="showLogo" style="accent-color:#4000B8">Show logo</label>
      </div>
      <div id="logoControls" style="display:none;flex-direction:column;gap:13px">
        <div class="ctrl">
          <label>Logo size <span style="color:var(--text-muted)">(% width)</span></label>
          <div class="row"><input type="range" id="logoSize" min="5" max="60" value="25" step="1"><span class="val" id="logoSizeOut">25%</span></div>
        </div>
        <div class="ctrl">
          <label>Logo position X</label>
          <div class="row"><input type="range" id="logoX" min="0" max="100" value="50" step="1"><span class="val" id="logoXOut">50%</span></div>
        </div>
        <div class="ctrl">
          <label>Logo position Y</label>
          <div class="row"><input type="range" id="logoY" min="0" max="100" value="50" step="1"><span class="val" id="logoYOut">50%</span></div>
        </div>
        <div class="ctrl">
          <label>Logo colour</label>
          <div class="swatches" id="logoSwatches" style="grid-template-columns:repeat(7,1fr)">
            <div class="sw logosw" data-fill="#21005E" style="background:#21005E;--fg:#21005E" title="Primary"></div>
            <div class="sw logosw" data-fill="#F3EAFF" style="background:#F3EAFF;--fg:#F3EAFF" title="Secondary"></div>
            <div class="sw logosw" data-fill="#4000B8" style="background:#4000B8;--fg:#4000B8" title="Tertiary"></div>
            <div class="sw logosw" data-fill="#FFFFFF" style="background:#FFFFFF;--fg:#FFFFFF" title="White"></div>
            <div class="sw logosw" data-fill="#FCFAFF" style="background:#FCFAFF;--fg:#FCFAFF" title="Neutral 005"></div>
            <div class="sw logosw" data-fill="#313131" style="background:#313131;--fg:#313131" title="Neutral 090"></div>
            <div class="sw logosw" data-fill="#1A1A1A" style="background:#1A1A1A;--fg:#1A1A1A" title="Neutral 100"></div>
          </div>
          <input type="hidden" id="logoColor" value="#21005E">
        </div>
        <div class="ctrl">
          <label>Clearance <span style="color:var(--text-muted)">(% logo width)</span></label>
          <div class="row"><input type="range" id="clearance" min="0" max="40" value="8" step="1"><span class="val" id="clearanceOut">8%</span></div>
        </div>
      </div>

      <div class="seg">Export</div>
      <div class="ctrl">
        <label class="row" style="cursor:pointer;color:var(--text)"><input type="checkbox" id="bgOnly" style="accent-color:#4000B8">Background only (no marks)</label>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const RATIOS={'1:1':[1,1],'16:9':[16,9],'9:16':[9,16],'5:4':[5,4],'4:5':[4,5]};
  let W=600,H=600,CX=300,CY=300;
  const AR=246/378;
  function applyRatio(name){
    const [rw,rh]=RATIOS[name];
    if(rw>=rh){H=600;W=Math.round(600*rw/rh);}else{W=600;H=Math.round(600*rh/rw);}
    CX=W/2;CY=H/2;
    const svg=document.getElementById('patternSvg');
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    bgRect.setAttribute('width',W);bgRect.setAttribute('height',H);
    document.querySelector('.canvas-shell').style.aspectRatio=`${rw}/${rh}`;
  }
  const elems=document.getElementById('elements');
  const bgRect=document.getElementById('bgRect');
  const MONO_PATH="M123 0C190.931 4.39387e-05 246 55.0699 246 123.001V254.2C246 322.131 190.931 377.201 123 377.201C55.0689 377.201 0 322.131 0 254.2V123.001C0 55.0699 55.0689 0 123 0ZM123 13.667C62.6168 13.667 13.667 62.6178 13.667 123.001V254.2C13.667 314.583 62.6168 363.534 123 363.534C183.383 363.534 232.333 314.583 232.333 254.2V123.001C232.333 62.6178 183.383 13.667 123 13.667ZM77.917 134.473L77.9756 136.655C79.1503 159.115 98.3309 177.346 122.307 177.346C146.281 177.344 165.458 159.114 166.633 136.655L166.691 134.473V106.6H192.674V267.381H166.691V187.687C154.55 197.313 139.082 203.072 122.307 203.072C105.531 203.072 90.0589 197.313 77.917 187.687V267.381H51.9336V106.6H77.917V134.473Z";
  const RAMP=['#D8C1FF','#B98CFF','#6E1FFF','#4000B8','#21005E'];

  // HeyMax wordmark — flat single-colour paths, source viewBox 0 0 400 109.
  const LOGO_VB_W=400, LOGO_VB_H=109, LOGO_AR=LOGO_VB_H/LOGO_VB_W;
  const LOGO_DS=[
    "M339.065 85L360.706 53.9061L338.952 23.04H356.492L373.462 48.0974H365.604L382.574 23.04H400L378.36 53.9061L399.887 85H382.46L365.717 60.0565H373.349L356.606 85H339.065Z",
    "M298.514 86.5C294.186 86.5 290.428 85.7786 287.238 84.336C284.049 82.8933 281.582 80.8431 279.835 78.1855C278.089 75.452 277.216 72.3008 277.216 68.7321C277.216 65.3151 277.975 62.2779 279.493 59.6203C281.012 56.8868 283.366 54.6088 286.555 52.7865C289.744 50.9641 293.769 49.6733 298.628 48.914L318.902 45.611V57.0007L301.476 59.962C298.514 60.4935 296.312 61.4426 294.87 62.8094C293.427 64.1762 292.706 65.9606 292.706 68.1626C292.706 70.2887 293.503 71.9971 295.097 73.2879C296.768 74.5028 298.818 75.1103 301.248 75.1103C304.361 75.1103 307.095 74.4649 309.448 73.174C311.878 71.8073 313.739 69.947 315.029 67.5931C316.396 65.2392 317.079 62.6575 317.079 59.8481V43.9025C317.079 41.2449 316.016 39.0429 313.89 37.2965C311.84 35.4741 309.107 34.5629 305.69 34.5629C302.501 34.5629 299.653 35.4362 297.148 37.1826C294.718 38.8531 292.933 41.093 291.794 43.9025L279.607 37.9799C280.822 34.7148 282.721 31.9053 285.302 29.5515C287.96 27.1217 291.073 25.2234 294.642 23.8566C298.211 22.4899 302.083 21.8065 306.259 21.8065C311.347 21.8065 315.827 22.7556 319.699 24.6539C323.572 26.4763 326.571 29.0579 328.697 32.3989C330.899 35.664 332 39.4985 332 43.9025V85.1332H317.877V74.5408L321.066 74.313C319.471 76.9706 317.573 79.2106 315.371 81.0329C313.169 82.7794 310.663 84.1461 307.854 85.1332C305.044 86.0444 301.931 86.5 298.514 86.5Z",
    "M137.239 108.964C136.176 108.964 134.999 108.85 133.708 108.622C132.493 108.47 131.317 108.204 130.178 107.825V101.446C131.089 101.674 132.114 101.864 133.253 102.016C134.468 102.168 135.569 102.244 136.556 102.244C140.276 102.168 143.2 101.256 145.326 99.5101C147.452 97.7636 149.388 94.8783 151.135 90.8539L155.463 80.717V87.0953L129.836 23.4268H137.353L159.335 78.3252H156.602L178.698 23.4268H186.329L158.082 92.3345C157.019 94.8403 155.615 97.384 153.868 99.9656C152.122 102.547 149.882 104.673 147.148 106.344C144.491 108.09 141.188 108.964 137.239 108.964Z",
    "M101.903 85.2726C96.2085 85.2726 91.0832 83.9058 86.5273 81.1723C81.9714 78.3628 78.3647 74.5663 75.7071 69.7826C73.0495 64.923 71.7207 59.4939 71.7207 53.4953C71.7207 47.4967 73.0115 42.1436 75.5932 37.4358C78.1748 32.6522 81.6677 28.8936 86.0717 26.16C90.4757 23.4265 95.4113 22.0597 100.878 22.0597C105.055 22.0597 108.813 22.819 112.154 24.3377C115.571 25.8563 118.494 27.9824 120.924 30.7159C123.43 33.3735 125.328 36.4487 126.619 39.9416C127.986 43.3585 128.669 46.9652 128.669 50.7618C128.669 51.5211 128.631 52.3184 128.555 53.1536C128.479 53.9889 128.365 54.8621 128.214 55.7733H75.7071V49.5089H124.341L121.266 51.9008C121.721 47.4967 121.076 43.5483 119.33 40.0555C117.583 36.4867 115.077 33.6772 111.812 31.6271C108.623 29.501 104.979 28.438 100.878 28.438C96.778 28.438 93.0194 29.539 89.6025 31.741C86.1856 33.8671 83.49 36.8284 81.5158 40.6249C79.5416 44.3456 78.6304 48.6737 78.7823 53.6092C78.6304 58.5448 79.5796 62.9108 81.6297 66.7074C83.6799 70.5039 86.4893 73.5032 90.0581 75.7052C93.6269 77.8313 97.5753 78.8944 101.903 78.8944C106.307 78.8944 110.142 77.8693 113.407 75.8191C116.672 73.6931 119.33 70.8836 121.38 67.3908L127.189 70.466C125.822 73.2754 123.886 75.8191 121.38 78.0971C118.874 80.2991 115.951 82.0455 112.61 83.3363C109.345 84.6272 105.776 85.2726 101.903 85.2726Z",
    "M0 84.8533V0H7.40331V38.6111H55.2401V0H62.6434V84.8533H55.2401V45.4449H7.40331V84.8533H0Z",
    "M195.479 0.0294961H209.118V85.2726H195.479V0.0294961Z",
    "M255.717 0.0296343H269.356V85.2727H255.717V0.0296343Z",
    "M232.417 51.8424C212.14 51.8424 195.479 32.8998 195.479 12.6911L209.118 12.6911C209.118 25.1235 219.426 38.2036 232.417 38.2036C245.409 38.2036 255.717 25.1234 255.717 12.6911L269.356 12.6911C269.356 32.8997 252.695 51.8424 232.417 51.8424Z"
  ];
  const LOGO_PATHS=LOGO_DS.map(d=>`<path d="${d}"/>`).join('');
  document.getElementById('logoSym').innerHTML=LOGO_PATHS;

  let seed=42;
  function makeNoise(){
    let s=seed;
    const rand=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
    const perm=new Uint8Array(512);
    const src=[...Array(256).keys()];
    for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1));[src[i],src[j]]=[src[j],src[i]];}
    for(let i=0;i<256;i++) perm[i]=perm[i+256]=src[i];
    const fade=t=>t*t*t*(t*(t*6-15)+10);
    const lerp=(a,b,t)=>a+(b-a)*t;
    function grad(h,x,y){const v=h&3,u=v<2?x:y,w=v<2?y:x;return((h&1)?-u:u)+((h&2)?-w:w);}
    return (x,y)=>{
      const X=Math.floor(x)&255,Y=Math.floor(y)&255;
      x-=Math.floor(x);y-=Math.floor(y);
      const u=fade(x),v=fade(y),a=perm[X]+Y,b=perm[X+1]+Y;
      return lerp(lerp(grad(perm[a],x,y),grad(perm[b],x-1,y),u),
                  lerp(grad(perm[a+1],x,y-1),grad(perm[b+1],x-1,y-1),u),v);
    };
  }
  let noise=makeNoise();

  const $=id=>document.getElementById(id);
  function vals(){return{
    type:$('patType').value, count:+$('count').value,
    sizePct:+$('elemSize').value/100, spread:+$('spread').value/100,
    rot:+$('rotation').value, bg:$('bgColor').value,
    color:$('elemColor').value,
    mode:$('colorMode').value, bgStyle:$('bgStyle').value,
    op:+$('opacity').value/100, ns:+$('noiseScale').value/10,
    str:+$('strength').value/100,
    showLogo:$('showLogo').checked, logoSize:+$('logoSize').value/100,
    logoX:+$('logoX').value, logoY:+$('logoY').value,
    logoColor:$('logoColor').value, clearance:+$('clearance').value/100
  };}

  // Logo bounding box in canvas coordinates, centred on (logoX%, logoY%).
  function logoBox(v){
    const w=v.logoSize*W, h=w*LOGO_AR;
    const cx=v.logoX/100*W, cy=v.logoY/100*H;
    return {x:cx-w/2,y:cy-h/2,w,h};
  }
  // 1-D squared Euclidean distance transform (Felzenszwalb & Huttenlocher).
  function edt1d(f,d,v,z,n){
    v[0]=0; z[0]=-1e20; z[1]=1e20;
    let k=0;
    for(let q=1;q<n;q++){
      let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);
      while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);}
      k++; v[k]=q; z[k]=s; z[k+1]=1e20;
    }
    k=0;
    for(let q=0;q<n;q++){
      while(z[k+1]<q) k++;
      d[q]=(q-v[k])*(q-v[k])+f[v[k]];
    }
  }
  function edt2d(data,w,h){
    const m=Math.max(w,h);
    const f=new Float64Array(m),d=new Float64Array(m),v=new Int32Array(m),z=new Float64Array(m+1);
    for(let x=0;x<w;x++){
      for(let y=0;y<h;y++) f[y]=data[y*w+x];
      edt1d(f,d,v,z,h);
      for(let y=0;y<h;y++) data[y*w+x]=d[y];
    }
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++) f[x]=data[y*w+x];
      edt1d(f,d,v,z,w);
      for(let x=0;x<w;x++) data[y*w+x]=d[x];
    }
  }

  // Distance-to-glyph field for the logo, cached by geometry. Rasterises the
  // wordmark, then EDT gives every canvas point its distance to the nearest
  // filled glyph pixel. Moving Clearance re-queries this without rebuilding.
  let logoField=null, logoFieldKey='';
  function getLogoField(v){
    const b=logoBox(v);
    const key=`${W}x${H}|${b.x.toFixed(1)}|${b.y.toFixed(1)}|${b.w.toFixed(1)}`;
    if(logoField && logoFieldKey===key) return logoField;
    const scale=384/Math.max(W,H);
    const fw=Math.max(1,Math.round(W*scale)), fh=Math.max(1,Math.round(H*scale));
    const cv=document.createElement('canvas'); cv.width=fw; cv.height=fh;
    const ctx=cv.getContext('2d');
    const gs=(b.w*scale)/LOGO_VB_W;
    ctx.setTransform(gs,0,0,gs,b.x*scale,b.y*scale);
    ctx.fillStyle='#000';
    LOGO_DS.forEach(d=>ctx.fill(new Path2D(d)));
    ctx.setTransform(1,0,0,1,0,0);
    const a=ctx.getImageData(0,0,fw,fh).data;
    const data=new Float64Array(fw*fh);
    for(let i=0;i<fw*fh;i++) data[i]=a[i*4+3]>32?0:1e20;
    edt2d(data,fw,fh);
    const dist=new Float32Array(fw*fh);
    for(let i=0;i<fw*fh;i++) dist[i]=Math.sqrt(data[i])/scale;
    logoField={dist,fw,fh,scale};
    logoFieldKey=key;
    return logoField;
  }

  // Placement-time exclusion: a mark is dropped when its bounding circle comes
  // within the clearance distance of the logo's glyph outline (not its box), so
  // marks can tuck into the negative space around the letterforms and never
  // overlap the logo. Clearance is measured outward from the glyph, in % of
  // logo width; at 0% the zone hugs the letterforms tightly.
  function makeExcluder(v){
    if(!v.showLogo) return null;
    const b=logoBox(v);
    const {dist,fw,fh,scale}=getLogoField(v);
    const clr=v.clearance*b.w;
    const K=Math.hypot(AR,1)/2; // half-diagonal of a size×(size*AR) mark
    return (x,y,size)=>{
      const ix=Math.min(fw-1,Math.max(0,Math.round(x*scale)));
      const iy=Math.min(fh-1,Math.max(0,Math.round(y*scale)));
      return dist[iy*fw+ix] < size*K + clr;
    };
  }

  let lastItems=[];

  function gridCells(v){
    const areaW=W*v.spread, areaH=H*v.spread;
    const cols=Math.max(1,Math.round(Math.sqrt(v.count*areaW/areaH)));
    const rows=Math.max(1,Math.round(v.count/cols));
    const ox=CX-areaW/2, oy=CY-areaH/2;
    const cw=areaW/cols, ch=areaH/rows;
    const maxSize=Math.min(ch,cw/AR);
    return {cols,rows,ox,oy,cw,ch,maxSize};
  }

  function build(v){
    const out=[];
    // The logo exclusion runs here, at placement time, alongside the patterns'
    // built-in non-overlap: a candidate that overlaps the logo zone is never
    // pushed, so spacing stays even at the edge and the count reflects reality.
    const excl=makeExcluder(v);
    const push=it=>{ if(!(excl&&excl(it.x,it.y,it.size))) out.push(it); };
    if(v.type==='grid'){
      const g=gridCells(v), size=g.maxSize*v.sizePct;
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++)
        push({x:g.ox+g.cw*(c+.5),y:g.oy+g.ch*(r+.5),size,rot:0,t:(r*g.cols+c)/(g.rows*g.cols)});
    } else if(v.type==='fibonacci'){
      const n=v.count, ga=2*Math.PI*(1-1/1.618033988749895);
      const R=(Math.hypot(W,H)/2)*v.spread;
      const pts=[];
      for(let i=0;i<n;i++){const r=R*Math.sqrt((i+.5)/n),a=i*ga;
        pts.push({x:CX+r*Math.cos(a),y:CY+r*Math.sin(a),t:i/n});}
      let minD=Infinity;
      for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
        const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;
        if(d<minD)minD=d;}
      const size=Math.sqrt(minD)*0.96*v.sizePct;
      pts.forEach(p=>push({x:p.x,y:p.y,size,rot:0,t:p.t}));
    } else if(v.type==='circles'||v.type==='orbit'){
      const R=(Math.hypot(W,H)/2)*v.spread;
      const rings=Math.max(2,Math.round(Math.sqrt(v.count/2.8)));
      const step=R/rings;
      const sumR=step*rings*(rings+1)/2;
      let minSize=step;
      const rd=[];
      for(let k=1;k<=rings;k++){
        const radius=step*k;
        const nk=Math.max(1,Math.round(v.count*radius/sumR));
        minSize=Math.min(minSize,2*Math.PI*radius/nk);
        rd.push({radius,nk,k});
      }
      const size=Math.min(minSize,step)*0.92*v.sizePct;
      rd.forEach(({radius,nk,k})=>{
        const phase=v.type==='orbit'?(k%2?1:-1)*v.str*180*(k/rings):0;
        for(let i=0;i<nk;i++){
          const a=2*Math.PI*i/nk + phase*Math.PI/180;
          const rot=v.type==='orbit'?(a*180/Math.PI+90):0;
          push({x:CX+radius*Math.cos(a),y:CY+radius*Math.sin(a),size,rot,t:k/rings});
        }
      });
    } else if(v.type==='perlin'){
      const g=gridCells(v), size=g.maxSize*v.sizePct;
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
        const x=g.ox+g.cw*(c+.5),y=g.oy+g.ch*(r+.5);
        const n=noise(x*v.ns/40,y*v.ns/40);
        push({x,y,size,rot:n*360,t:(n+1)/2});
      }
    } else if(v.type==='halftone'){
      const g=gridCells(v);
      const maxD=Math.hypot(g.cw*g.cols,g.ch*g.rows)/2;
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
        const x=g.ox+g.cw*(c+.5),y=g.oy+g.ch*(r+.5);
        const n=(noise(x*v.ns/60,y*v.ns/60)+1)/2;
        const d=Math.hypot(x-CX,y-CY)/maxD;
        const f=Math.max(0.12,1-v.str*(0.65*d+0.35*(1-n)));
        push({x,y,size:g.maxSize*v.sizePct*f,rot:0,t:1-f});
      }
    } else if(v.type==='waves'){
      const g=gridCells(v);
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
        const x=g.ox+g.cw*(c+.5),y=g.oy+g.ch*(r+.5);
        const ph=(c/g.cols)*Math.PI*2*v.ns + r*0.6;
        const s=Math.sin(ph);
        const f=1-v.str*0.5*(1+s)*0.85;
        push({x,y,size:g.maxSize*v.sizePct*Math.max(0.15,f),rot:s*v.str*60,t:(s+1)/2});
      }
    } else { // cascade
      const g=gridCells(v);
      const maxI=g.rows+g.cols-2||1;
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
        const x=g.ox+g.cw*(c+.5),y=g.oy+g.ch*(r+.5);
        const t=(r+c)/maxI;
        const f=Math.max(0.12,1-v.str*t);
        push({x,y,size:g.maxSize*v.sizePct*f,rot:v.str*t*90,t});
      }
    }
    return out;
  }

  function markColor(it,v){
    if(v.mode==='mono') return v.color;
    const i=Math.min(RAMP.length-1,Math.floor(it.t*RAMP.length));
    return RAMP[i];
  }

  const TINTS=['#CFF3F8','#FBDFF2','#CDB4FF','#E4D9FF'];
  let bgSeed=7;
  function bgFxMarkup(v,s,prefix){
    if(v.bgStyle==='solid') return '';
    let r=(bgSeed^0x9e3779b9)>>>0;
    const rnd=()=>{r=(r*1664525+1013904223)>>>0;return r/4294967296;};
    const n=v.bgStyle==='grad2'?2:1;
    const base=Math.floor(rnd()*TINTS.length);
    let defs='',shapes='';
    for(let i=0;i<n;i++){
      const tint=TINTS[(base+i*2)%TINTS.length];
      const id=prefix+'tint'+i;
      const cx=(0.2+rnd()*0.6)*W*s;
      const cy=(n===2?(i===0?0.05+rnd()*0.3:0.65+rnd()*0.3):0.15+rnd()*0.7)*H*s;
      const rx=(0.5+rnd()*0.35)*Math.max(W,H)*s;
      const ry=rx*(0.45+rnd()*0.55);
      const rot=Math.round(rnd()*180);
      defs+=`<radialGradient id="${id}"><stop offset="0%" stop-color="${tint}" stop-opacity="0.9"/><stop offset="100%" stop-color="${tint}" stop-opacity="0"/></radialGradient>`;
      shapes+=`<ellipse cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${rot} ${cx.toFixed(1)} ${cy.toFixed(1)})" fill="url(#${id})"/>`;
    }
    return `<defs>${defs}</defs>${shapes}`;
  }

  function draw(){
    const v=vals();
    applyRatio($('ratio').value);
    const alpha=v.bgStyle==='alpha';
    bgRect.setAttribute('fill',alpha?'none':v.bg);
    document.querySelector('.canvas-shell').classList.toggle('alpha',alpha);
    document.getElementById('bgFx').innerHTML=alpha?'':bgFxMarkup(v,1,'pv');
    document.querySelector('.bgbase').style.display=alpha?'none':'block';
    $('moveGradBtn').style.display=(v.bgStyle==='grad1'||v.bgStyle==='grad2')?'':'none';
    document.querySelectorAll('.cond').forEach(e=>{
      e.style.display=e.dataset.for.split(' ').includes(v.type)?'block':'none';});
    const items=build(v);
    lastItems=items;
    elems.innerHTML='';
    items.forEach(it=>{
      const h=it.size,w=it.size*AR;
      const u=document.createElementNS(NS,'use');
      u.setAttribute('href','#mono');
      u.setAttribute('width',w.toFixed(2));
      u.setAttribute('height',h.toFixed(2));
      u.setAttribute('transform',`translate(${it.x.toFixed(2)} ${it.y.toFixed(2)}) rotate(${(it.rot+v.rot).toFixed(1)}) translate(${(-w/2).toFixed(2)} ${(-h/2).toFixed(2)})`);
      u.setAttribute('fill',markColor(it,v));
      if(v.op<1) u.setAttribute('opacity',v.op.toFixed(2));
      elems.appendChild(u);
    });
    $('actualCount').textContent=items.length;
    $('patName').textContent=$('patType').selectedOptions[0].textContent.toLowerCase();

    // Logo layer — topmost, above the pattern.
    $('logoControls').style.display=v.showLogo?'flex':'none';
    const logo=document.getElementById('logo');
    logo.innerHTML='';
    if(v.showLogo){
      const b=logoBox(v);
      const u=document.createElementNS(NS,'use');
      u.setAttribute('href','#logoSym');
      u.setAttribute('x',b.x.toFixed(2));
      u.setAttribute('y',b.y.toFixed(2));
      u.setAttribute('width',b.w.toFixed(2));
      u.setAttribute('height',b.h.toFixed(2));
      u.setAttribute('fill',v.logoColor);
      logo.appendChild(u);
    }
  }

  function bind(id,outId,fmt){
    const el=$(id),out=outId?$(outId):null;
    el.addEventListener('input',()=>{if(out)out.textContent=fmt?fmt(el.value):el.value;draw();});
  }
  bind('ratio');bind('patType');bind('count','countOut');
  bind('elemSize','elemSizeOut',x=>x+'%');
  bind('spread','spreadOut',x=>x+'%');
  bind('rotation','rotationOut',x=>x+'°');
  bind('noiseScale','noiseScaleOut');
  bind('strength','strengthOut',x=>x+'%');
  bind('bgColor');bind('elemColor');
  bind('colorMode');
  $('bgStyle').addEventListener('input',()=>{
    const st=$('bgStyle').value;
    if(st==='grad1'||st==='grad2'){
      const c=$('bgColor').value;
      const lum=parseInt(c.slice(1,3),16)*0.299+parseInt(c.slice(3,5),16)*0.587+parseInt(c.slice(5,7),16)*0.114;
      if(lum<180){
        $('bgColor').value='#F9F5FF';
        if($('colorMode').value==='mono') $('elemColor').value='#21005E';
      }
    }
    draw();
  });

  document.querySelectorAll('.sw[data-base]').forEach(sw=>{
    sw.addEventListener('click',()=>{
      $('bgColor').value=sw.dataset.base;
      if($('colorMode').value==='mono') selectFill('#21005E');
      draw();
    });
  });
  bind('opacity','opacityOut',x=>x+'%');

  function selectFill(color){
    $('elemColor').value=color;
    document.querySelectorAll('.sw.fill').forEach(s=>
      s.classList.toggle('sel',s.dataset.fill.toLowerCase()===color.toLowerCase()));
  }
  document.querySelectorAll('.sw.fill').forEach(sw=>{
    sw.addEventListener('click',()=>{selectFill(sw.dataset.fill);draw();});
  });

  document.querySelectorAll('.sw[data-bg]').forEach(sw=>{
    sw.addEventListener('click',()=>{
      $('bgColor').value=sw.dataset.bg;
      selectFill(sw.dataset.fg);
      draw();
    });
  });
  selectFill($('elemColor').value);

  $('showLogo').addEventListener('change',draw);
  bind('logoSize','logoSizeOut',x=>x+'%');
  bind('logoX','logoXOut',x=>x+'%');
  bind('logoY','logoYOut',x=>x+'%');
  bind('clearance','clearanceOut',x=>x+'%');
  function selectLogo(color){
    $('logoColor').value=color;
    document.querySelectorAll('.sw.logosw').forEach(s=>
      s.classList.toggle('sel',s.dataset.fill.toLowerCase()===color.toLowerCase()));
  }
  document.querySelectorAll('.sw.logosw').forEach(sw=>{
    sw.addEventListener('click',()=>{selectLogo(sw.dataset.fill);draw();});
  });
  selectLogo($('logoColor').value);

  $('shuffleBtn').addEventListener('click',()=>{
    seed=(Math.random()*1e9)>>>0;
    noise=makeNoise();
    draw();
  });

  $('moveGradBtn').addEventListener('click',()=>{
    bgSeed=(Math.random()*1e9)>>>0;
    draw();
  });

  function buildStandaloneSVG(px){
    const v=vals();
    const s=px/Math.min(W,H);
    const outW=Math.round(W*s), outH=Math.round(H*s);
    let body='';
    const items=$('bgOnly').checked?[]:lastItems;
    items.forEach(it=>{
      const h=it.size,w=it.size*AR;
      const tr=`translate(${(it.x*s).toFixed(2)} ${(it.y*s).toFixed(2)}) rotate(${(it.rot+v.rot).toFixed(1)}) scale(${s.toFixed(4)}) translate(${(-w/2).toFixed(2)} ${(-h/2).toFixed(2)}) scale(${(w/246).toFixed(5)} ${(h/378).toFixed(5)})`;
      const op=v.op<1?` fill-opacity="${v.op.toFixed(2)}"`:'';
      body+=`<path transform="${tr}" d="${MONO_PATH}" fill="${markColor(it,v)}"${op}/>`;
    });
    // Logo as real vector paths (no raster embed), topmost. Skipped for background-only.
    let logo='';
    if(v.showLogo && !$('bgOnly').checked){
      const b=logoBox(v), sc=(b.w*s)/LOGO_VB_W;
      logo=`<g transform="translate(${(b.x*s).toFixed(2)} ${(b.y*s).toFixed(2)}) scale(${sc.toFixed(6)})" fill="${v.logoColor}">${LOGO_PATHS}</g>`;
    }
    return `<?xml version="1.0" encoding="UTF-8"?>\n`+
      `<svg xmlns="${NS}" width="${outW}" height="${outH}" viewBox="0 0 ${outW} ${outH}">`+
      (v.bgStyle==='alpha'?'':`<rect width="${outW}" height="${outH}" fill="${v.bg}"/>${bgFxMarkup(v,s,'ex')}`)+
      `${body}${logo}</svg>`;
  }

  function download(blob,name){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }

  $('exportBtn').addEventListener('click',()=>{
    download(new Blob([buildStandaloneSVG(1080)],{type:'image/svg+xml'}),
      'heymax-pattern-'+$('patType').value+'-'+$('ratio').value.replace(':','x')+($('bgStyle').value==='alpha'?'-alpha':'')+($('bgOnly').checked?'-bg':'')+'.svg');
  });

  $('exportPngBtn').addEventListener('click',()=>{
    const px=2160;
    const s=px/Math.min(W,H);
    const outW=Math.round(W*s), outH=Math.round(H*s);
    const svgBlob=new Blob([buildStandaloneSVG(px)],{type:'image/svg+xml'});
    const url=URL.createObjectURL(svgBlob);
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=outW;canvas.height=outH;
      canvas.getContext('2d').drawImage(img,0,0,outW,outH);
      URL.revokeObjectURL(url);
      canvas.toBlob(b=>download(b,'heymax-pattern-'+$('patType').value+'-'+$('ratio').value.replace(':','x')+($('bgStyle').value==='alpha'?'-alpha':'')+($('bgOnly').checked?'-bg':'')+'.png'),'image/png');
    };
    img.src=url;
  });

  draw();
})();
</script>
</body>
</html>
